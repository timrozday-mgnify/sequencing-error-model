[project]
name = "sequencing-error-model"
version = "0.0.1"
description = "Train sequencing error models from skiver (k,v)-mer outputs and export them to read simulators."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "numpy>=2.4.6",
    "scipy>=1.17.1",
]

[project.scripts]
sem-generate = "sequencing_error_model.generate:main"

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pre-commit>=4",
    "pytest",
    "ruff>=0.16",
    "scipy-stubs>=1.17.1.5",
]

[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
# ponytail: matches CI/.python-version; numpy>=2.5 stubs use 3.12 syntax. ruff still targets py311.
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
