name: skiver-compat

# Regenerates the analyze fixtures with released skiver binaries and checks the
# parsers still read them. Weekly so a new upstream release is caught.
on:
  pull_request:
    branches: [main]
    paths:
      - "src/sequencing_error_model/sources/skiver_*"
      - "tests/fixtures/**"
      - "tests/test_skiver_*"
      - ".github/workflows/skiver-compat.yml"
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  skiver-compat:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        skiver: [v0.3.1, v0.3.2, latest]
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv + Python
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install
        run: uv sync --locked

      - name: Download skiver ${{ matrix.skiver }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ matrix.skiver }}"
          if [ "$tag" = latest ]; then tag=$(gh release view -R GZHoffie/skiver --json tagName -q .tagName); fi
          gh release download "$tag" -R GZHoffie/skiver -p skiver -O "$RUNNER_TEMP/skiver"
          chmod +x "$RUNNER_TEMP/skiver"
          "$RUNNER_TEMP/skiver" --version

      - name: Regenerate fixtures
        run: uv run python tests/fixtures/make_skiver_fixtures.py "$RUNNER_TEMP/skiver" "$RUNNER_TEMP/out"

      - name: Parse regenerated outputs
        run: SKIVER_ANALYZE_DIR="$RUNNER_TEMP/out" uv run pytest -vv tests/test_skiver_analyze.py

      # Committed fixtures come from this artifact: skiver's x86-64 release binary and an
      # arm64 build count slightly differently, so only CI output diffs cleanly.
      - name: Upload regenerated outputs
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: skiver-analyze-${{ matrix.skiver }}
          path: ${{ runner.temp }}/out/analyze.*.csv

      # Bootstrap CIs (hazard_rate, summary_error_rate, summary_phred, summary_gc_content) vary run to run.
      #
      # Reported, not gating: skiver does not process the same number of observations twice. Measured
      # 2026-09-28 on two of three attempts against an unchanged fixture: 709 of 712 kvmer rows differed, every
      # one of them *lower* and none higher, with observations x0.866 and error mass x0.867 - so the implied
      # error rate came back to within 0.1% and only the effective sample size moved. The third attempt matched
      # the committed fixture byte for byte. That makes a hard diff a coin flip that blocks any PR touching
      # these paths, while protecting nothing the parse step above does not already gate. So the diff is kept
      # for drift, and it warns instead of failing; the regenerated CSVs are in the artifact either way.
      #
      # Do not regenerate and commit the fixture to make this quiet: that bakes in one short run.
      - name: Diff deterministic outputs against committed fixtures
        if: matrix.skiver == 'v0.3.2'
        continue-on-error: true
        run: |
          status=0
          for f in kvmer summary_error_spectrum summary_error_spectrum_dependence_on_t summary_read_position survival_rate; do
            if diff "tests/fixtures/skiver-v0.3.2/analyze.$f.csv" "$RUNNER_TEMP/out/analyze.$f.csv" > "diff.$f.txt"; then
              echo "analyze.$f.csv matches the committed fixture"
            else
              lines=$(grep -c '^[<>]' "diff.$f.txt" || true)
              echo "::warning::analyze.$f.csv differs from the committed fixture ($lines changed lines)"
              echo "- \`analyze.$f.csv\`: $lines changed lines" >> "$GITHUB_STEP_SUMMARY"
              head -20 "diff.$f.txt"
              status=1
            fi
          done
          exit $status
