# CD: a pushed `vX.Y.Z` tag builds the sdist + wheel and attaches them to a
# GitHub release. PyPI/bioconda publishing is deferred until the API is stable
# (see docs/IMPLEMENTATION_PLAN.md, phase 13).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv + Python
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"

      - name: Check tag matches package version
        run: test "v$(uv version --short)" = "${GITHUB_REF_NAME}"

      - name: Test
        run: uv sync --locked && uv run pytest -q

      - name: Build
        run: uv build

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes --verify-tag
